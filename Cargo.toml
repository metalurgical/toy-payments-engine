[package]
name = "toy-payments-engine"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", default-features = false, features = [
  "derive",
  "help",
  "std"
] }
csv = "1.4.0"
log = "0.4.33"
log4rs = "1.4.0"
num_cpus = "1.17.0"
postcard = { version = "1.1.3", features = ["alloc"] }
serde = { version = "1.0.229", features = ["derive"] }
sled = "0.34.7"
thiserror = "2.0.20"
tokio = { version = "1.53.1", default-features = false, features = [
  "macros",
  "rt-multi-thread",
  "sync"
] }

[dev-dependencies]
rstest = "0.26.1"

[profile.release]
opt-level = 3
strip = true
lto = "fat"
panic = "abort"
codegen-units = 1
