[package]
name = "toy-payments-engine"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.6", default-features = false, features = ["derive", "std", "help"] }
tokio = { version = "1.53.1", default-features = false, features = ["rt-multi-thread", "macros"] }
thiserror = "2.0.20"
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
futures-util = "0.3.34"
csv = "1.4.0"
rstest = "0.26.1"
sled = "0.34.7"
postcard = { version = "1.1.3", features = ["alloc"] }